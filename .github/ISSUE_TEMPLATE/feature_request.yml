name: Feature request
description: Suggest an idea or improvement for ZidCMS.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ZidCMS is at an early stage and deliberately small in scope (see docs/limitations.md). The planned next steps are listed in the roadmap in docs/history/retrospective.md ("Recommended next steps"). Please check it before opening a request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the solution you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links or anything else that helps. Do not include secrets or personal e-mail addresses.
